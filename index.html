<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Degen Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e0a;
    --surface: #10150f;
    --surface2: #161d14;
    --text: #d7f5d0;
    --muted: #62795d;
    --accent: #7CFF6B;
    --accent-dim: #4a9f40;
    --danger: #FF5C5C;
    --border: #23301f;
    --font-display: 'JetBrains Mono', monospace;
    --font-body: 'JetBrains Mono', monospace;
    --radius: 4px;
  }

  [data-theme="chrollo"] {
    --bg: #0d0b14;
    --surface: #17131f;
    --surface2: #1e1829;
    --text: #ece6f5;
    --muted: #8577a3;
    --accent: #C9A227;
    --accent-dim: #8a6f1c;
    --danger: #E63950;
    --border: #2c2438;
  }

  [data-theme="paper"] {
    --bg: #f4f1e9;
    --surface: #ffffff;
    --surface2: #ebe6da;
    --text: #221f1a;
    --muted: #857c6c;
    --accent: #1F6F5C;
    --accent-dim: #164e41;
    --danger: #B23A3A;
    --border: #ddd5c3;
  }

  [data-font="mono"] { --font-display: 'JetBrains Mono', monospace; --font-body: 'JetBrains Mono', monospace; }
  [data-font="serif"] { --font-display: 'Fraunces', serif; --font-body: 'JetBrains Mono', monospace; }
  [data-font="grotesk"] { --font-display: 'Space Grotesk', sans-serif; --font-body: 'Space Grotesk', sans-serif; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    transition: background .25s ease, color .25s ease;
    min-height: 100vh;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  .brand { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .brand .dim { color: var(--muted); font-weight: 400; font-size: 13px; display:block; margin-top:2px; }

  .controls { display: flex; gap: 6px; }
  select {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 12px; font-family: var(--font-body); font-size: 12px;
    cursor: pointer;
  }

  .pnl-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 14px 18px; margin-bottom: 20px;
  }
  .pnl-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .pnl-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin-top: 2px; }
  .pnl-value.pos { color: var(--accent); }
  .pnl-value.neg { color: var(--danger); }

  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    margin: 24px 0 10px; font-family: var(--font-display);
  }

  form.entry {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;
  }
  form.entry .full { grid-column: 1 / -1; }
  input, textarea {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 14px; font-family: var(--font-body); font-size: 13px; width: 100%;
  }
  textarea { resize: vertical; min-height: 44px; border-radius: 18px; }
  input::placeholder, textarea::placeholder { color: var(--muted); }

  .pnl-input-row { display: flex; gap: 8px; align-items: center; }
  .pnl-input-row select { flex: 0 0 auto; }

  button.add {
    grid-column: 1 / -1; background: var(--accent); color: var(--bg); border: none;
    border-radius: 999px; padding: 12px; font-family: var(--font-display); font-weight: 700;
    font-size: 13px; cursor: pointer; margin-top: 4px;
  }
  button.add:hover { opacity: .9; }

  .trade {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 12px 16px; margin-bottom: 8px;
  }
  .trade-head { display: flex; justify-content: space-between; align-items: baseline; }
  .ticker { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
  .trade-pnl { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
  .trade-pnl.pos { color: var(--accent); }
  .trade-pnl.neg { color: var(--danger); }
  .trade-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .trade-detail { font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
  .trade-detail b { color: var(--muted); font-weight: 500; }
  .del-btn {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px;
    text-decoration: underline; padding: 0; margin-top: 8px;
  }
  .del-btn:hover { color: var(--danger); }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; border: 1px dashed var(--border); border-radius: var(--radius); }

  textarea#reflection { min-height: 80px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">DEGEN LEDGER<span class="dim" id="dateLabel"></span></div>
    <div class="controls">
      <select id="themeSelect">
        <option value="terminal">Terminal</option>
        <option value="chrollo">Chrollo</option>
        <option value="paper">Paper</option>
      </select>
      <select id="fontSelect">
        <option value="mono">Mono</option>
        <option value="serif">Serif</option>
        <option value="grotesk">Grotesk</option>
      </select>
    </div>
  </header>

  <div class="pnl-bar">
    <div>
      <div class="pnl-label">Today's PnL</div>
      <div class="pnl-value" id="dailyPnl">0.00 SOL</div>
    </div>
    <div style="text-align:right">
      <div class="pnl-label">Trades</div>
      <div class="pnl-value" id="tradeCount" style="font-size:20px">0</div>
    </div>
  </div>

  <div class="section-label">New Entry</div>
  <form class="entry" id="entryForm">
    <input id="ticker" placeholder="Ticker ($DOGWIF)" required>
    <div class="pnl-input-row">
      <select id="pnlSign"><option value="1">+</option><option value="-1">−</option></select>
      <input id="pnlAmt" type="number" step="0.001" placeholder="PnL (SOL)" required>
    </div>
    <input id="lore" class="full" placeholder="Lore / narrative">
    <input id="whyBought" class="full" placeholder="Why bought">
    <input id="buyTime" placeholder="Buy time">
    <input id="buyMc" placeholder="Buy MC">
    <input id="sellTime" placeholder="Sell time">
    <input id="sellMc" placeholder="Sell MC">
    <input id="whySold" class="full" placeholder="Why sold">
    <button type="submit" class="add">Log Trade</button>
  </form>

  <div class="section-label">Entries</div>
  <div id="trades"></div>

  <div class="section-label">Reflection</div>
  <textarea id="reflection" placeholder="How'd you trade today? Discipline check..."></textarea>

</div>

<script>
const $ = id => document.getElementById(id);
const todayKey = () => new Date().toISOString().slice(0,10);

function loadState() {
  const theme = localStorage.getItem('ledger-theme') || 'terminal';
  const font = localStorage.getItem('ledger-font') || 'mono';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-font', font);
  $('themeSelect').value = theme;
  $('fontSelect').value = font;
}

function saveTrades(trades) {
  localStorage.setItem('ledger-trades-' + todayKey(), JSON.stringify(trades));
}
function getTrades() {
  try {
    return JSON.parse(localStorage.getItem('ledger-trades-' + todayKey())) || [];
  } catch(e) { return []; }
}
function saveReflection(text) {
  localStorage.setItem('ledger-reflection-' + todayKey(), text);
}
function getReflection() {
  return localStorage.getItem('ledger-reflection-' + todayKey()) || '';
}

function render() {
  const trades = getTrades();
  const container = $('trades');
  container.innerHTML = '';
  if (trades.length === 0) {
    container.innerHTML = '<div class="empty">No trades logged yet today.</div>';
  } else {
    trades.slice().reverse().forEach((t, idxRev) => {
      const idx = trades.length - 1 - idxRev;
      const pos = t.pnl >= 0;
      const div = document.createElement('div');
      div.className = 'trade';
      div.innerHTML = `
        <div class="trade-head">
          <span class="ticker">${escapeHtml(t.ticker)}</span>
          <span class="trade-pnl ${pos ? 'pos' : 'neg'}">${pos ? '+' : ''}${t.pnl.toFixed(3)} SOL</span>
        </div>
        <div class="trade-meta">${escapeHtml(t.buyTime||'—')} @ ${escapeHtml(t.buyMc||'—')} MC → ${escapeHtml(t.sellTime||'—')} @ ${escapeHtml(t.sellMc||'—')} MC</div>
        ${t.lore ? `<div class="trade-detail"><b>Lore:</b> ${escapeHtml(t.lore)}</div>` : ''}
        ${t.whyBought ? `<div class="trade-detail"><b>Bought:</b> ${escapeHtml(t.whyBought)}</div>` : ''}
        ${t.whySold ? `<div class="trade-detail"><b>Sold:</b> ${escapeHtml(t.whySold)}</div>` : ''}
        <button class="del-btn" data-idx="${idx}">remove</button>
      `;
      container.appendChild(div);
    });
  }

  const total = trades.reduce((s,t) => s + t.pnl, 0);
  const pnlEl = $('dailyPnl');
  pnlEl.textContent = (total >= 0 ? '+' : '') + total.toFixed(3) + ' SOL';
  pnlEl.className = 'pnl-value ' + (total >= 0 ? 'pos' : 'neg');
  $('tradeCount').textContent = trades.length;

  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = () => {
      const trades = getTrades();
      trades.splice(Number(btn.dataset.idx), 1);
      saveTrades(trades);
      render();
    };
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

$('entryForm').addEventListener('submit', e => {
  e.preventDefault();
  const trades = getTrades();
  trades.push({
    ticker: $('ticker').value.trim(),
    pnl: parseFloat($('pnlSign').value) * parseFloat($('pnlAmt').value || 0),
    lore: $('lore').value.trim(),
    whyBought: $('whyBought').value.trim(),
    buyTime: $('buyTime').value.trim(),
    buyMc: $('buyMc').value.trim(),
    sellTime: $('sellTime').value.trim(),
    sellMc: $('sellMc').value.trim(),
    whySold: $('whySold').value.trim(),
  });
  saveTrades(trades);
  e.target.reset();
  $('pnlSign').value = '1';
  render();
});

$('themeSelect').addEventListener('change', e => {
  document.documentElement.setAttribute('data-theme', e.target.value);
  localStorage.setItem('ledger-theme', e.target.value);
});
$('fontSelect').addEventListener('change', e => {
  document.documentElement.setAttribute('data-font', e.target.value);
  localStorage.setItem('ledger-font', e.target.value);
});

$('reflection').addEventListener('input', e => saveReflection(e.target.value));

loadState();
$('dateLabel').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
$('reflection').value = getReflection();
render();
</script>
</body>
</html>
