<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>memecoin journal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0A0E0F;
    color: #E8E6E1;
    font-family: 'SF Mono', Consolas, 'Courier New', monospace;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.2em; color: #8B8578; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; margin: 0 0 24px; font-weight: 600; color: #F4F1EA; }
  .addbtn {
    width: 100%; padding: 12px; background: transparent;
    border: 1px dashed #3A3F3E; color: #8B8578; font-family: inherit;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; margin-bottom: 24px;
  }
  .form { border: 1px solid #262B2C; background: #121616; padding: 18px; margin-bottom: 24px; display: none; }
  .form.open { display: block; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 9px; color: #5A5F5C; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; background: #0A0E0F; border: 1px solid #262B2C; color: #E8E6E1;
    font-family: inherit; font-size: 12px; padding: 7px 9px; outline: none;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .coin-row { border: 1px solid #1E2323; background: #0E1212; padding: 12px; margin-bottom: 14px; }
  .coin-row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .coin-row-head span { font-size: 9px; color: #5A5F5C; text-transform: uppercase; letter-spacing: 0.1em; }
  .linkbtn { background: none; border: none; color: #5A5F5C; font-size: 9px; cursor: pointer; font-family: inherit; }
  .addcoin {
    width: 100%; padding: 8px; background: transparent; border: 1px dashed #3A3F3E;
    color: #5A5F5C; font-family: inherit; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; margin-bottom: 16px;
  }
  .btnrow { display: flex; gap: 8px; margin-top: 16px; }
  .primary { padding: 8px 16px; background: #C9A961; color: #0A0E0F; border: none; font-family: inherit; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; font-weight: 600; }
  .ghost { padding: 8px 16px; background: transparent; color: #8B8578; border: 1px solid #3A3F3E; font-family: inherit; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; }
  .error { color: #FF5C5C; font-size: 11px; margin-top: 8px; }
  .empty { color: #8B8578; font-size: 12px; padding: 24px 0; text-align: center; border-top: 1px solid #1A1F20; }
  .day { border: 1px solid #262B2C; background: #121616; padding: 14px 16px; margin-bottom: 14px; }
  .day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .day-date { font-size: 12px; color: #8B8578; }
  .day-total { font-size: 13px; font-weight: 600; }
  .coin-view { border-left: 3px solid #8B8578; padding-left: 10px; margin-bottom: 8px; }
  .coin-view .tk { font-weight: 600; color: #F4F1EA; font-size: 13px; }
  .coin-view .st { font-size: 10px; color: #5A5F5C; margin-left: 8px; }
  .coin-view .lore { font-size: 11px; color: #8B8578; margin-top: 3px; }
  .coin-view .why { font-size: 11px; color: #B5B0A5; margin-top: 3px; }
  .coin-view .mc { font-size: 10px; color: #5A5F5C; margin-top: 3px; }
  .reflection { font-size: 11px; color: #8B8578; margin-top: 10px; padding-top: 10px; border-top: 1px solid #1E2323; line-height: 1.5; }
  textarea { resize: vertical; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Degen Ledger</div>
  <h1>memecoin journal</h1>

  <button class="addbtn" id="toggleForm">+ log today</button>

  <div class="form" id="form">
    <div class="field">
      <label>date</label>
      <input type="date" id="dayDate" style="max-width:180px" />
    </div>

    <div id="coinRows"></div>

    <button class="addcoin" id="addCoin">+ add another coin</button>

    <div class="field">
      <label>total for the day</label>
      <input type="text" id="dayTotal" placeholder="e.g. +0.8 SOL or -12%" />
    </div>
    <div class="field">
      <label>how you traded today</label>
      <textarea id="dayReflection" rows="3" placeholder="discipline, mistakes, what you'd repeat, state of mind"></textarea>
    </div>

    <div class="error" id="formError" style="display:none;"></div>

    <div class="btnrow">
      <button class="primary" id="saveDay">save day</button>
      <button class="ghost" id="cancelDay">cancel</button>
    </div>
  </div>

  <div id="dayList"></div>
</div>

<script>
const STORAGE_KEY = "meme-journal-days";

function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function loadDays() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveDays(days) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(days));
}

let days = loadDays();
let draftCoins = [];

function emptyCoin() {
  return { id: uid(), ticker: "", lore: "", whyBought: "", buyTime: "", buyMc: "", sellTime: "", sellMc: "", whySold: "", status: "Open" };
}

function resetDraft() {
  draftCoins = [emptyCoin()];
  document.getElementById("dayDate").value = new Date().toISOString().slice(0, 10);
  document.getElementById("dayTotal").value = "";
  document.getElementById("dayReflection").value = "";
  document.getElementById("formError").style.display = "none";
  renderCoinRows();
}

function renderCoinRows() {
  const container = document.getElementById("coinRows");
  container.innerHTML = "";
  draftCoins.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "coin-row";
    row.innerHTML = `
      <div class="coin-row-head">
        <span>coin ${i + 1}</span>
        ${draftCoins.length > 1 ? `<button class="linkbtn" data-remove="${c.id}">remove</button>` : ""}
      </div>
      <div class="grid2">
        <div class="field">
          <label>ticker</label>
          <input type="text" placeholder="$TICKER" data-field="ticker" data-id="${c.id}" value="${c.ticker}" />
        </div>
        <div class="field">
          <label>status</label>
          <select data-field="status" data-id="${c.id}">
            ${["Open","Win","Loss","BE"].map(s => `<option ${c.status===s?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field">
        <label>lore / narrative</label>
        <textarea rows="2" placeholder="what's the story, meta, or catalyst" data-field="lore" data-id="${c.id}">${c.lore}</textarea>
      </div>
      <div class="field">
        <label>why bought</label>
        <textarea rows="2" placeholder="your thesis / trigger" data-field="whyBought" data-id="${c.id}">${c.whyBought}</textarea>
      </div>
      <div class="grid2">
        <div class="field"><label>buy time</label><input type="text" placeholder="e.g. 2:14pm" data-field="buyTime" data-id="${c.id}" value="${c.buyTime}" /></div>
        <div class="field"><label>buy mc</label><input type="text" placeholder="e.g. 80k" data-field="buyMc" data-id="${c.id}" value="${c.buyMc}" /></div>
        <div class="field"><label>sell time</label><input type="text" placeholder="e.g. 2:40pm" data-field="sellTime" data-id="${c.id}" value="${c.sellTime}" /></div>
        <div class="field"><label>sell mc</label><input type="text" placeholder="e.g. 210k" data-field="sellMc" data-id="${c.id}" value="${c.sellMc}" /></div>
      </div>
      <div class="field">
        <label>why sold</label>
        <textarea rows="2" placeholder="target hit, lost momentum, bailed on red flag..." data-field="whySold" data-id="${c.id}">${c.whySold}</textarea>
      </div>
    `;
    container.appendChild(row);
  });

  container.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", (e) => {
      const id = e.target.getAttribute("data-id");
      const field = e.target.getAttribute("data-field");
      const coin = draftCoins.find(c => c.id === id);
      if (coin) coin[field] = e.target.value;
    });
  });

  container.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const id = e.target.getAttribute("data-remove");
      draftCoins = draftCoins.filter(c => c.id !== id);
      renderCoinRows();
    });
  });
}

function totalColor(t) {
  const n = parseFloat(String(t).replace(/[^0-9.-]/g, ""));
  if (isNaN(n)) return "#8B8578";
  return n > 0 ? "#00D993" : n < 0 ? "#FF5C5C" : "#8B8578";
}

function statusColor(s) {
  return s === "Win" ? "#00D993" : s === "Loss" ? "#FF5C5C" : "#8B8578";
}

function renderDays() {
  const list = document.getElementById("dayList");
  if (days.length === 0) {
    list.innerHTML = `<div class="empty">no days logged yet. every run starts with a log.</div>`;
    return;
  }
  list.innerHTML = days.map(d => `
    <div class="day">
      <div class="day-head">
        <span class="day-date">${d.date}</span>
        <div style="display:flex; gap:10px; align-items:center;">
          ${d.total ? `<span class="day-total" style="color:${totalColor(d.total)}">${d.total}</span>` : ""}
          <button class="linkbtn" data-deleteday="${d.id}">delete</button>
        </div>
      </div>
      ${d.buys.map(b => `
        <div class="coin-view" style="border-left-color:${statusColor(b.status)}">
          <span class="tk">${b.ticker}</span><span class="st">${b.status}</span>
          ${b.lore ? `<div class="lore">${b.lore}</div>` : ""}
          ${b.whyBought ? `<div class="why">bought: ${b.whyBought}</div>` : ""}
          <div class="mc">
            ${b.buyTime ? `in ${b.buyTime}` : ""}${b.buyMc ? ` @ ${b.buyMc} mc` : ""}
            ${(b.sellTime || b.sellMc) ? "  →  " : ""}
            ${b.sellTime ? `out ${b.sellTime}` : ""}${b.sellMc ? ` @ ${b.sellMc} mc` : ""}
          </div>
          ${b.whySold ? `<div class="why">sold: ${b.whySold}</div>` : ""}
        </div>
      `).join("")}
      ${d.reflection ? `<div class="reflection">${d.reflection}</div>` : ""}
    </div>
  `).join("");

  list.querySelectorAll("[data-deleteday]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const id = e.target.getAttribute("data-deleteday");
      days = days.filter(d => d.id !== id);
      saveDays(days);
      renderDays();
    });
  });
}

document.getElementById("toggleForm").addEventListener("click", () => {
  document.getElementById("form").classList.add("open");
  document.getElementById("toggleForm").style.display = "none";
  resetDraft();
});

document.getElementById("cancelDay").addEventListener("click", () => {
  document.getElementById("form").classList.remove("open");
  document.getElementById("toggleForm").style.display = "block";
});

document.getElementById("addCoin").addEventListener("click", () => {
  draftCoins.push(emptyCoin());
  renderCoinRows();
});

document.getElementById("saveDay").addEventListener("click", () => {
  const cleanCoins = draftCoins.filter(c => c.ticker.trim());
  const errEl = document.getElementById("formError");
  if (cleanCoins.length === 0) {
    errEl.textContent = "Log at least one coin.";
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";
  const newDay = {
    id: uid(),
    date: document.getElementById("dayDate").value,
    buys: cleanCoins,
    total: document.getElementById("dayTotal").value,
    reflection: document.getElementById("dayReflection").value
  };
  days = [newDay, ...days];
  saveDays(days);
  renderDays();
  document.getElementById("form").classList.remove("open");
  document.getElementById("toggleForm").style.display = "block";
});

resetDraft();
renderDays();
</script>
</body>
</html>
